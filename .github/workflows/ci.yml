name: mollad checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: m-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Build-only placeholders; this job never connects to Neon or migrates data.
      NEON_DATABASE_URL: postgresql://ci:ci@localhost:5432/m?sslmode=require
      NEON_DIRECT_URL: postgresql://ci:ci@localhost:5432/m?sslmode=require
      NEXTAUTH_SECRET: ci-placeholder-for-build-only-not-a-production-secret
      APP_URL: http://localhost:3000
      OCR_PROVIDER: tesseract
      E2E_PRODUCTION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run format:check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/mobile.spec.ts e2e/access.spec.ts
